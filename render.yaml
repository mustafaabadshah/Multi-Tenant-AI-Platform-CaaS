# Render Infrastructure as Code Blueprint
# Multi-Tenant AI Platform / CaaS - M13 Free-Tier Staging Topology
#
# Topology: Render Free backend (Docker + Tesseract) + Render Free frontend (Next.js
# Node runtime) + Neon Free PostgreSQL 16 + Backblaze B2 Free object storage.
# No Render Postgres: the Free Render Postgres expires 30 days after creation and has
# no backups or managed pooling. Database and object storage are external services.
# The existing PYTHON_VERSION pin is retained even though the Docker runtime ignores it.
services:
  # -----------------------------------------------------------------------------
  # BACKEND FASTAPI WEB SERVICE (Docker: Python 3.12 + Tesseract OCR)
  # -----------------------------------------------------------------------------
  - type: web
    name: mmaip-backend
    runtime: docker
    region: oregon
    plan: free
    # These paths are relative to the repository root. This service intentionally has
    # no rootDir: Render resolves dockerfilePath/dockerContext relative to rootDir, and
    # the Dockerfile lives outside the backend build context. Render's Blueprint
    # reference shows the same Dockerfile-outside-context arrangement.
    dockerfilePath: infrastructure/docker/backend.Dockerfile
    dockerContext: backend
    # Free services cannot use preDeployCommand (paid-only). Run the idempotent
    # migration before Uvicorn inside the container start command. Render injects PORT,
    # so this also avoids relying on the Dockerfile's hardcoded --port 8000.
    dockerCommand: '/bin/sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"'
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: PROJECT_NAME
        value: "Multi-Tenant AI Platform-CaaS"
      - key: API_V1_STR
        value: /api/v1
      # Retained for provenance. The Docker base image python:3.12-slim selects Python.
      - key: PYTHON_VERSION
        value: "3.12.3"

      # Database: Neon Free PostgreSQL 16 (external; no Render database block).
      # Set both values in the Render Dashboard. DATABASE_URL is the asyncpg URL and
      # MUST use ?ssl=require, not Neon's ?sslmode=require. DATABASE_SYNC_URL is the
      # direct libpq URL (used by offline Alembic) and uses ?sslmode=require.
      - key: DATABASE_SYNC_URL
        sync: false
      - key: DATABASE_URL
        sync: false

      # Security & JWT Tokens (generated by Render; never commit real values)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # BYOK Key Encryption (Render-generated; rotate through the dashboard)
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: PREVIOUS_SECRET_KEYS
        value: ""

      # Rate Limiting & Proxy Trust
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUSTED_PROXY_IPS
        sync: false

      # CORS & deployed origins (exact HTTPS origins, set per deployment)
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      # Explicitly empty: disables the broad Vercel preview regex code default.
      - key: CORS_ORIGIN_REGEX
        value: "^$"

      # Retrieval & Vector Store Configuration
      - key: DEFAULT_RETRIEVAL_MODE
        value: hybrid
      - key: DEFAULT_VECTOR_STORE
        value: pgvector
      # CPU-local, zero-download embeddings sized for the 512 MB Free instance.
      - key: DEFAULT_EMBEDDING_PROVIDER
        value: local
      - key: DEFAULT_EMBEDDING_MODEL
        value: local-feature-projection
      - key: DEFAULT_EMBEDDING_DIMENSIONS
        value: "384"
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: RRF_K_CONSTANT
        value: "60"

      # Inline Ingestion Dispatcher (single-process Free envelope)
      # Uploads and retries already call asyncio.create_task(); the dispatcher is the
      # safety net. A 3600-second empty-queue poll avoids waking Neon every 2 seconds,
      # preserving the Neon Free 100 CU-hour allowance during idle periods.
      - key: INGESTION_INLINE_DISPATCHER_ENABLED
        value: "true"
      - key: INGESTION_DISPATCHER_POLL_SECONDS
        value: "3600"
      - key: INGESTION_LEASE_SECONDS
        value: "3600"
      - key: INGESTION_MAX_CONCURRENCY
        value: "1"

      # AI Gateway Settings (OmniRoute OpenAI-compatible gateway; operator supplied)
      - key: LLM_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false

      # Storage: Backblaze B2 Free (private S3-compatible bucket).
      # S3_ENDPOINT_URL is https://s3.<region>.backblazeb2.com and S3_REGION_NAME is the
      # bucket's actual region code (for example us-west-004), never "auto" or us-east-1.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION_NAME
        sync: false
      # B2 S3 compatibility fallback for botocore flexible checksums.
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

  # -----------------------------------------------------------------------------
  # FRONTEND NEXT.JS WEB SERVICE (Node runtime; dynamic routes need next start)
  # -----------------------------------------------------------------------------
  - type: web
    name: mmaip-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start -- -p $PORT"
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      # Verified available on Render. Next 16 requires Node >= 20.9.
      - key: NODE_VERSION
        value: "22.22.0"
      # Build-time public value. Set the exact backend HTTPS origin (no /api/v1, no
      # trailing slash). Changing it requires a rebuild, not only a restart.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
