services:
  # ---------------------------------------------------------------------------
  # CORE SERVICES: Database, Backend, Frontend
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mmaip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mmaip_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmaip_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: mmaip_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/mmaip_dev
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/mmaip_dev
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-in-production-min-32-bytes-long}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-change-me-in-production-min-32-bytes}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/app/data/storage
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_storage:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: mmaip_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ---------------------------------------------------------------------------
  # OPTIONAL PROFILES: Vector DB, Cache, Observability
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: mmaip_qdrant
    restart: unless-stopped
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: mmaip_redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: mmaip_phoenix
    restart: unless-stopped
    profiles: ["phoenix"]
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_PORT=6006

volumes:
  postgres_data:
  backend_storage:
  qdrant_data:
  redis_data:
