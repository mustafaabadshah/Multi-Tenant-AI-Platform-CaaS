# Dedicated isolated Qdrant vector store compose specification for M05 Integration Testing
# Binds to 127.0.0.1:6333; conservative 256MB memory limit, CPU-only execution without GPU dependencies.

services:
  m05-qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: m05_qdrant_test
    restart: "no"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - m05_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

volumes:
  m05_qdrant_data:
